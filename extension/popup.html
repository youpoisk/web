<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouPoisk</title><link rel="stylesheet" href="extension.css"></head>
<body class="popup"><header><a class="brand site-link" href="#"><img src="assets/rhino.svg" alt="" class="rhino"><img src="assets/wordmark.svg" alt="YouPoisk" class="logo-text"></a><a class="gear" href="options.html" target="_blank" aria-label="Настройки">⚙</a></header>
<main><div class="eyebrow">ЛИЧНАЯ БИБЛИОТЕКА YOUTUBE</div><div class="tabs"><button data-tab="video" class="active">Текущее видео</button><button data-tab="later">Посмотрю позже</button><button data-tab="library">Все</button></div>
<p id="mode" class="hint">Локальный режим · без аккаунта</p><section id="empty-view" hidden><h1>Откройте видео на YouTube</h1><p class="hint" id="empty-text">Выберите обычное видео в youtube.com и снова откройте расширение. Shorts не поддерживаются.</p><button id="retry" class="secondary full">Обновить</button><button id="demo" class="secondary full" hidden>Открыть пример для проверки интерфейса</button></section>
<section id="video-view" hidden><img id="preview" class="video-preview" alt="Превью видео"><div id="channel" class="channel"></div><h1 id="title"></h1><div class="divider"></div><div class="row"><h2>Ваша оценка</h2><span id="score-label"></span></div><div class="scores" id="scores"></div><button id="clear" class="text">Удалить оценку</button><button id="save" class="primary full">＋ Посмотрю позже</button><button id="add" class="secondary full">Добавить в библиотеку</button><details id="channel-section"><summary>Оценить канал</summary><div class="scores" id="channel-scores"></div><button id="clear-channel" class="text">Удалить оценку канала</button></details><a id="watch" class="secondary full" target="_blank" rel="noreferrer">Смотреть на YouTube ↗</a></section>
<section id="list-view" hidden><h2 id="list-title">Посмотрю позже</h2><div id="video-list"></div></section><p id="status" role="status" aria-live="polite"></p></main>
<footer><span>Данные на этом устройстве</span><a class="site-link" href="#">Открыть сайт ↗</a></footer><script src="core.js"></script><script src="bridge.js"></script><script src="demo-catalog.js"></script><script src="popup.js"></script></body></html>
